# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/kjanat/actionlint/actionlint.schema.json
# github-hosted-runners: https://docs.github.com/actions/reference/runners/github-hosted-runners
# available-images: https://github.com/actions/runner-images#available-images
---
assume-default-permissions: permissive
policy:
  require-job-timeout: true
  required-actions: []
  require-commit-hash: false
config-secrets: []
