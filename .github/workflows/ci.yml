name: ci
on: { push: { branches: [master] }, pull_request: { branches: [master] } }
permissions: { contents: read }
defaults: { run: { shell: bash } }
env: { RUNNER_RUNNER: make }
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy: { matrix: { os: [ubuntu-26.04, macos-15, windows-2025-vs2026] }, fail-fast: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: kjanat/runner@8baa9ee978cfed038b98741749673c788ff161d1 # v0.26.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      # bash 3.2 ships with macOS and cannot run tests/completions.sh.
      - if: runner.os == 'macOS'
        run: brew untap aws/tap && brew install fish bash
      - run: run test
        env: { COMPLETIONS_SHELLS: "${{ runner.os == 'Windows' && 'bash' || 'bash zsh fish' }}" }
      - name: Test setup action
        run: node --test tests/action.test.mjs
      - name: Install latest release
        id: setup
        uses: ./
      - name: Check installed version
        run: |
          actual_version=$(envctl --version)
          test "${actual_version}" = "${EXPECTED_VERSION}"
        env: { EXPECTED_VERSION: "${{ steps.setup.outputs.version }}" }
  freebsd:
    uses: $/.github/workflows/freebsd.yml
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: [{ uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 }, { uses: kjanat/actionlint@722799fa4b8cc6734debb97bae24aca9e0dbaf59 }]
