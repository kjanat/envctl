name: FreeBSD
on: { workflow_call: { inputs: { version: { type: string, default: ci } } } }
permissions: { contents: read }
env:
  FREEBSD_RELEASE: "13.5"
jobs:
  build:
    name: FreeBSD 13.5 / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, vm-arch: x86_64 }
          - { arch: arm64, vm-arch: aarch64 }
    steps:
      - uses: actions/checkout@v7
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
          FILE: envctl-freebsd-${{ matrix.arch }}
        with:
          release: ${{ env.FREEBSD_RELEASE }}
          arch: ${{ matrix.vm-arch }}
          envs: VERSION ARCH
          prepare: pkg install -y gmake bash zsh fish node24
          run: |
            set -eu
            # Version fixtures derive the default version from the checkout.
            env -u VERSION gmake test
            gmake "dist-freebsd-${ARCH}" VERSION="${VERSION}"
            node .github/check-artifact.mjs "dist/${{ env.FILE }}" "${VERSION}"
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: ${{ env.FILE }}
          path: "dist/${{ env.FILE }}"
