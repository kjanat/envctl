name: release
on: { push: { tags: [v*] } }
permissions: { contents: read }
defaults: { run: { shell: bash } }
env: { RUNNER_RUNNER: make }
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: [
          { os: ubuntu-26.04, target: dist-linux-amd64, artifact: envctl-linux-amd64 },
          { os: ubuntu-26.04-arm, target: dist-linux-arm64, artifact: envctl-linux-arm64 },
          { os: windows-2025-vs2026, target: dist-windows-amd64, artifact: envctl-windows-amd64.exe },
          { os: windows-11-vs2026-arm, target: dist-windows-arm64, artifact: envctl-windows-arm64.exe },
          { os: macos-15-intel, target: dist-darwin-amd64, artifact: envctl-darwin-amd64 },
          { os: macos-15, target: dist-darwin-arm64, artifact: envctl-darwin-arm64 },
        ]
    steps:
      - uses: actions/checkout@v7
      - uses: kjanat/runner@v0.26.1
      - name: Set up ARM64 compiler
        if: matrix.target == 'dist-windows-arm64'
        uses: msys2/setup-msys2@v2
        with: { msystem: CLANGARM64, update: true, install: "make mingw-w64-clang-aarch64-clang" }
      - name: Build artifact
        if: matrix.target != 'dist-windows-arm64'
        run: run '${{ matrix.target }}'
      - name: Build ARM64 Windows artifact
        if: matrix.target == 'dist-windows-arm64'
        shell: msys2 {0}
        run: make dist-windows-arm64 VERSION="${GITHUB_REF_NAME}"
      - name: Verify artifact architecture and version
        run: node .github/check-artifact.mjs "dist/${ARTIFACT}"
        env: { ARTIFACT: "${{ matrix.artifact }}" }
      - uses: actions/upload-artifact@v7
        with: { if-no-files-found: error, name: "${{ matrix.artifact }}", path: "dist/${{ matrix.artifact }}" }
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
          test -s "${RUNNER_TEMP}/notes.md" || {
            echo "tag ${GITHUB_REF_NAME} carries no message body to release with" >&2
            exit 1
          }
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: make checksums
      - name: Attest build provenance
        id: attest
        uses: actions/attest@v4
        with: { subject-path: dist/envctl-* }
      - name: Add provenance verification to release notes
        env: { ATTESTATION_URL: "${{ steps.attest.outputs.attestation-url }}" }
        run: |
          test -n "${ATTESTATION_URL}"
          {
            printf '\n\nAll six binaries have a [build provenance attestation](%s).\n\n' "${ATTESTATION_URL}"
            printf 'Verify a downloaded binary with the GitHub CLI, substituting its filename:\n\n'
            printf '%s\n' '```sh' 'gh attestation verify ./envctl-linux-amd64 --owner kjanat --signer-workflow kjanat/envctl/.github/workflows/release.yml' '```'
          } >> "${RUNNER_TEMP}/notes.md"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          working_directory: dist
          files: "envctl-*\nSHA256SUMS"
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
